<text x="52" y="242" fill="#e9ff69" font-family="Impact, Arial Black, sans-serif" font-size="160" font-weight="900" letter-spacing="-6">COSSITO.</text>
<text x="60" y="298" fill="#fffbed" font-family="Arial, sans-serif" font-size="30" font-weight="700">Read the task. Write the code. Prove it works.</text>
<text x="61" y="339" fill="#b9b6c5" font-family="Arial, sans-serif" font-size="19">One browser. A focused agent. You stay in control.</text>
